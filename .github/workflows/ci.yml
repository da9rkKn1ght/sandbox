
name: CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Prepare version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}

    steps:
      - name: Calculate version
        id: version
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          VERSION="$(date -u +%Y%m%d-%H%M%S)"
          OWNER="$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          echo "Generated version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build builder stage
        run: |
          docker build \
            --target builder \
            -t sandbox-backend-builder:ci \
            -f src/backend/Dockerfile .

      - name: Run tests
        run: |
          mkdir -p reports

          docker run --rm \
            -v "$PWD/reports:/reports" \
            sandbox-backend-builder:ci \
            sh -c '
              set -e

              go install github.com/jstemmer/go-junit-report/v2@v2.1.0

              set +e
              CGO_ENABLED=0 go test -v -coverprofile=/reports/coverage.out ./... \
                > /reports/test.log 2>&1
              rc=$?
              set -e

              "$(go env GOPATH)/bin/go-junit-report" \
                < /reports/test.log > /reports/junit.xml

              if [ -f /reports/coverage.out ]; then
                go tool cover -func=/reports/coverage.out \
                  > /reports/coverage.txt
              fi

              exit $rc
            '

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: reports/
          if-no-files-found: warn

  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs:
      - version
      - test

    concurrency:
      group: build-${{ github.ref }}-${{ matrix.component }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.version.outputs.owner }}/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
