
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-backend
  labels:
    app: sandbox-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-backend
  template:
    metadata:
      labels:
        app: sandbox-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/da9rkkn1ght/sandbox-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: sandbox-backend
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
